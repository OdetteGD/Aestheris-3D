name: Aetheris Engine Android CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# Keep build configuration centralized and reproducible.
env:
  JAVA_VERSION: "17"
  ANDROID_NDK_VERSION: "27.2.12479018"
  ANDROID_CMAKE_VERSION: "3.22.1"
  ANDROID_API_LEVEL: "35"

jobs:
  android-build:
    name: Build Aetheris Engine Editor
    runs-on: ubuntu-latest

    # Avoid overlapping builds for the same branch/PR.
    concurrency:
      group: aetheris-android-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout Aetheris Engine
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Java 17
      # Required by modern Android Gradle Plugin/toolchains.
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ------------------------------------------------------------
      # Android SDK / NDK / CMake
      # sdkmanager is used explicitly so the native build environment
      # is deterministic instead of relying on whatever happens to be
      # preinstalled on the GitHub-hosted runner.
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "${ANDROID_SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"

          echo "Installed Android SDK:"
          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-${ANDROID_API_LEVEL}|build-tools;35.0.0|ndk;${ANDROID_NDK_VERSION}|cmake;${ANDROID_CMAKE_VERSION}" \
            || true

      # ------------------------------------------------------------
      # Validate native toolchain.
      # This catches incorrectly configured runners before Gradle
      # starts an expensive Android/CMake build.
      # ------------------------------------------------------------
      - name: Verify Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          CMAKE_HOME="${ANDROID_SDK_ROOT}/cmake/${ANDROID_CMAKE_VERSION}"

          test -d "${NDK_HOME}"
          test -x "${CMAKE_HOME}/bin/cmake"

          echo "NDK: ${NDK_HOME}"
          "${NDK_HOME}/ndk-build" --version

          echo "CMake: ${CMAKE_HOME}"
          "${CMAKE_HOME}/bin/cmake" --version

          echo "ANDROID_NDK_HOME=${NDK_HOME}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${NDK_HOME}" >> "${GITHUB_ENV}"
          echo "CMAKE_HOME=${CMAKE_HOME}" >> "${GITHUB_ENV}"

          echo "${CMAKE_HOME}/bin" >> "${GITHUB_PATH}"

      # ------------------------------------------------------------
      # Gradle wrapper permissions.
      # Required on fresh GitHub-hosted Linux runners.
      # ------------------------------------------------------------
      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew

      # ------------------------------------------------------------
      # Gradle dependency/build cache.
      #
      # setup-java's Gradle cache handles the normal Gradle dependency
      # cache. This additional cache preserves project-local Gradle
      # build outputs where possible between workflow executions.
      # ------------------------------------------------------------
      - name: Cache Gradle build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            app/.gradle
          key: >-
            ${{ runner.os }}-gradle-
            ${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ------------------------------------------------------------
      # C/C++ compiler cache.
      #
      # Aetheris contains a substantial C++20/Vulkan native layer, so
      # ccache significantly reduces rebuild time when only a subset
      # of the renderer/editor sources changed.
      # ------------------------------------------------------------
      - name: Install and configure ccache
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ccache

          mkdir -p "${HOME}/.ccache"

          ccache --version

          echo "CCACHE_DIR=${HOME}/.ccache" >> "${GITHUB_ENV}"
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "CCACHE_COMPILERCHECK=content" >> "${GITHUB_ENV}"

          ccache --set-config=max_size=2G

          # Make ccache discoverable before CMake/Gradle starts.
          echo "/usr/lib/ccache" >> "${GITHUB_PATH}"

      # ------------------------------------------------------------
      # Persist ccache between workflow runs.
      # ------------------------------------------------------------
      - name: Cache CMake / NDK compilation
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            **/.cxx
          key: >-
            ${{ runner.os }}-aetheris-native-
            ndk-${{ env.ANDROID_NDK_VERSION }}-
            cmake-${{ env.ANDROID_CMAKE_VERSION }}-
            ${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '**/*.cpp', '**/*.cc', '**/*.c', '**/*.h', '**/*.hpp') }}
          restore-keys: |
            ${{ runner.os }}-aetheris-native-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}-
            ${{ runner.os }}-aetheris-native-

      # ------------------------------------------------------------
      # Configure ccache for the Android NDK toolchain.
      #
      # CMake/Gradle remains responsible for selecting the actual
      # Android clang compiler; ccache only accelerates compilation.
      # ------------------------------------------------------------
      - name: Configure native compiler cache
        shell: bash
        run: |
          set -euo pipefail

          ccache --zero-stats

          # These variables are consumed by the Android/CMake toolchain.
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "${GITHUB_ENV}"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "${GITHUB_ENV}"

      # ------------------------------------------------------------
      # Report environment before the build.
      # Useful when diagnosing NDK/CMake/Gradle incompatibilities.
      # ------------------------------------------------------------
      - name: Print build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Java ==="
          java -version

          echo "=== Gradle ==="
          ./gradlew --version

          echo "=== Android SDK ==="
          echo "${ANDROID_SDK_ROOT}"

          echo "=== Android NDK ==="
          echo "${ANDROID_NDK_ROOT}"

          echo "=== CMake ==="
          cmake --version

          echo "=== ccache ==="
          ccache --show-config

      # ------------------------------------------------------------
      # Build Aetheris Editor.
      #
      # assembleRelease is intentionally used for CI because it
      # exercises the production Android/native packaging path.
      #
      # IMPORTANT:
      # The Android Gradle module should define:
      #
      #   ndk {
      #       abiFilters "armeabi-v7a", "arm64-v8a"
      #   }
      #
      # or the equivalent modern AGP configuration.
      #
      # This workflow does not silently alter the application's
      # Gradle configuration, keeping architecture decisions inside
      # the project itself.
      # ------------------------------------------------------------
      - name: Build Aetheris Engine Editor
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
          CMAKE_GENERATOR: Ninja
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleRelease

      # ------------------------------------------------------------
      # Display ccache statistics after the native build.
      # ------------------------------------------------------------
      - name: Show native compiler cache statistics
        if: always()
        shell: bash
        run: |
          ccache --show-stats || true

      # ------------------------------------------------------------
      # Locate the generated APK.
      #
      # The build can produce variant-specific filenames, so we search
      # the complete Android output tree rather than assuming a single
      # hard-coded Gradle filename.
      # ------------------------------------------------------------
      - name: Locate release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk"

          if [[ ! -d "${APK_DIR}" ]]; then
            echo "APK output directory does not exist:"
            echo "${APK_DIR}"
            exit 1
          fi

          mapfile -t APKS < <(
            find "${APK_DIR}" \
              -type f \
              -name "*.apk" \
              -print \
              | sort
          )

          if [[ "${#APKS[@]}" -eq 0 ]]; then
            echo "No APK was produced."
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi

          echo "Generated APKs:"
          printf '  %s\n' "${APKS[@]}"

          # Prefer a release APK when multiple variants are present.
          RELEASE_APK=""

          for apk in "${APKS[@]}"; do
            if [[ "${apk}" == *"/release/"* ]]; then
              RELEASE_APK="${apk}"
              break
            fi
          done

          if [[ -z "${RELEASE_APK}" ]]; then
            RELEASE_APK="${APKS[0]}"
          fi

          echo "Selected APK:"
          echo "${RELEASE_APK}"

          echo "apk_path=${RELEASE_APK}" >> "${GITHUB_OUTPUT}"

      # ------------------------------------------------------------
      # Rename/copy the selected APK to the stable artifact name.
      # This gives developers a predictable filename regardless of
      # the Gradle application/version naming configuration.
      # ------------------------------------------------------------
      - name: Prepare Aetheris Engine artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp "${{ steps.apk.outputs.apk_path }}" \
            "artifacts/AetherisEngine-Editor.apk"

          ls -lh artifacts/AetherisEngine-Editor.apk

      # ------------------------------------------------------------
      # Upload APK for developers/QA to download from the workflow.
      # PR builds therefore produce a directly testable Android package.
      # ------------------------------------------------------------
      - name: Upload Aetheris Engine Editor APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherisEngine-Editor
          path: artifacts/AetherisEngine-Editor.apk
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      # ------------------------------------------------------------
      # Upload native build diagnostics if the build fails.
      # This is especially useful for CMake/NDK/Vulkan compilation
      # failures without polluting successful artifacts.
      # ------------------------------------------------------------
      - name: Upload native build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AetherisEngine-build-diagnostics
          path: |
            app/build/outputs/logs/**
            app/build/intermediates/cxx/**
            app/.cxx/**
          if-no-files-found: ignore
          retention-days: 7
