name: Aetheris Engine Android CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  ANDROID_NDK_VERSION: "27.2.12479018"
  ANDROID_CMAKE_VERSION: "3.22.1"
  ANDROID_API_LEVEL: "35"

jobs:
  android-build:
    name: Build Aetheris Engine Editor
    runs-on: ubuntu-latest

    concurrency:
      group: aetheris-android-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      contents: read

    steps:
      - name: Checkout Aetheris Engine
        uses: actions/checkout@v5

      # Install Java 17 and let setup-java restore Gradle dependencies.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # GitHub's Ubuntu image already provides the Android command-line tools.
      # Avoid android-actions/setup-android: its current defaults request the
      # removed legacy "tools" SDK package and fail before the native build.
      - name: Configure Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          fi

          test -n "${SDKMANAGER}"
          test -x "${SDKMANAGER}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "SDKMANAGER=${SDKMANAGER}" >> "${GITHUB_ENV}"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true

      # Pin the exact Android platform, NDK and CMake versions used by CI.
      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
      # Verify that the exact native toolchain requested by the project exists.
      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          CMAKE_HOME="${ANDROID_SDK_ROOT}/cmake/${ANDROID_CMAKE_VERSION}"

          test -d "${NDK_HOME}"
          test -x "${CMAKE_HOME}/bin/cmake"

          echo "ANDROID_NDK_HOME=${NDK_HOME}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${NDK_HOME}" >> "${GITHUB_ENV}"
          echo "CMAKE_HOME=${CMAKE_HOME}" >> "${GITHUB_ENV}"
          echo "${CMAKE_HOME}/bin" >> "${GITHUB_PATH}"

          "${NDK_HOME}/ndk-build" --version
          "${CMAKE_HOME}/bin/cmake" --version

      # The repository now contains a self-bootstrapping Gradle wrapper.
      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      # Cache native C++ compiler results and Android/CMake intermediates.
      - name: Install ccache
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ccache
          mkdir -p "${HOME}/.ccache"
          ccache --set-config=max_size=2G
          ccache --set-config=compiler_check=content
          echo "CCACHE_DIR=${HOME}/.ccache" >> "${GITHUB_ENV}"
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"

      - name: Cache native build
        uses: actions/cache@v5
        with:
          path: |
            ~/.ccache
            app/.cxx
            .gradle
            ~/.gradle/aether-wrapper
          key: >-
            ${{ runner.os }}-aetheris-native-
            ndk-${{ env.ANDROID_NDK_VERSION }}-
            cmake-${{ env.ANDROID_CMAKE_VERSION }}-
            ${{ hashFiles('CMakeLists.txt', 'engine/**/*.cpp', 'engine/**/*.h', 'android/**/*.cpp', 'android/**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-aetheris-native-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}-
            ${{ runner.os }}-aetheris-native-

      # Confirm the Gradle project is present before starting the expensive build.
      - name: Validate Android Gradle project
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          test -f ./settings.gradle.kts
          test -f ./build.gradle.kts
          test -f ./app/build.gradle.kts
          test -f ./app/src/main/AndroidManifest.xml
          test -f ./CMakeLists.txt

          echo "Android Gradle project detected."
          echo "Native ABIs: armeabi-v7a, arm64-v8a"

      - name: Validate deferred renderer boot contract
        shell: bash
        run: |
          set -euo pipefail

          grep -F "enum class EngineState" engine/core/EngineCore.h
          grep -F "EngineState::SurfaceReady" engine/core/EngineCore.cpp
          grep -F "EngineState::AllocatingAssets" engine/core/EngineCore.cpp
          grep -F "EnsureDeferredResources()" engine/renderer/IAetherisRenderer.h
          grep -F "AbortDeferredResources()" engine/renderer/IAetherisRenderer.h
          grep -F "RecordSafeClear()" engine/renderer/VulkanRenderer.cpp
          grep -F "AetherisEngine_Fatal" android/JniBridge.cpp
          test -f app/src/main/assets/fallback_shaders/ssao_mobile_es300.glsl
          test ! -f app/src/main/shaders/ssao_mobile_es300.frag

          grep -F "target_compile_features(aetheris3d PRIVATE cxx_std_20)" CMakeLists.txt

      # Build the production release. Retry transient Gradle/SDK cache failures,
      # while still failing deterministically after the final compiler attempt.
      - name: Build Aetheris Engine Editor
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          set -euo pipefail

          build_attempt() {
            ./gradlew \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              assembleRelease
          }

          for attempt in 1 2 3; do
            echo "Aetheris Android build attempt ${attempt}/3"
            if build_attempt; then
              echo "Aetheris Android build succeeded on attempt ${attempt}"
              exit 0
            fi

            if [[ "${attempt}" -lt 3 ]]; then
              echo "Retrying after refreshing native intermediates..."
              rm -rf app/.cxx
              ./gradlew --stop || true
              sleep $((attempt * 5))
            fi
          done

          echo "Aetheris Android build failed after 3 attempts."
          exit 1

      # Display native cache efficiency without making it a build failure.
      - name: Show ccache statistics
        if: always()
        shell: bash
        run: ccache --show-stats || true

      # Locate the actual release APK generated by Gradle.
      - name: Locate release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find app/build/outputs/apk/release \
              -type f -name "*.apk" -print | sort
          )

          if [[ "${#APKS[@]}" -eq 0 ]]; then
            echo "No release APK was produced."
            find app/build/outputs -maxdepth 6 -type f -print || true
            exit 1
          fi

          APK="${APKS[0]}"
          echo "Selected APK: ${APK}"
          echo "apk_path=${APK}" >> "${GITHUB_OUTPUT}"

      # Ensure the packaged APK really contains both requested native ABIs.
      - name: Validate APK native ABIs
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.apk_path }}"

          command -v unzip >/dev/null 2>&1

          unzip -l "${APK}" | grep -F "lib/armeabi-v7a/libaetheris3d.so"
          unzip -l "${APK}" | grep -F "lib/arm64-v8a/libaetheris3d.so"

          echo "Both Aetheris native ABIs are present."

      # Give every workflow run a stable, developer-friendly artifact filename.
      - name: Prepare Aetheris Engine artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "${{ steps.apk.outputs.apk_path }}" "artifacts/AetherisEngine-Editor.apk"
          ls -lh artifacts/AetherisEngine-Editor.apk

      # Upload the APK so PR #1 can be installed directly on Android hardware.
      - name: Upload Aetheris Engine Editor APK
        uses: actions/upload-artifact@v5
        with:
          name: AetherisEngine-Editor
          path: artifacts/AetherisEngine-Editor.apk
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      # Preserve native/CMake diagnostics when a build fails.
      - name: Upload native build diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: AetherisEngine-build-diagnostics
          path: |
            app/build/outputs/logs/**
            app/build/intermediates/cxx/**
            app/.cxx/**
          if-no-files-found: ignore
          retention-days: 7
